palette = "catppuccin_macchiato"
format = "$username$hostname$directory\n$character"
right_format = "$cmd_duration $time"

[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c1b4"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f2d5ae"
yellow = "#efdfac"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#a6e0ea"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#a4aaf0"
text = "#cad3f5"



[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](mauve)"

[username]
show_always = true
style_user = "sky"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "lavender"
format = "@[$hostname]($style)"

[directory]
style = "blue"
truncation_length = 3
truncation_symbol = "…/"
format = " [$path]($style)"

[time]
disabled = false
style = "pink"
format = '[ $time ]($style)'
time_format = '%T'

[cmd_duration]
disabled = false
style = "peach"
show_milliseconds = true
min_time = 0
format = '[ $duration ]($style)'
